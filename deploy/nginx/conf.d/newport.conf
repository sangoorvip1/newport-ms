limit_req_zone $binary_remote_addr zone=api_burst:20m rate=25r/s;

# بوابة المعمل: TLS داخلي + تمرير /api إلى الخادم + تقديم واجهة سطح المكتب (نسخة الويب للمراجعة)
# الشهادات الداخلية: ضع newport.local.crt/key في deploy/nginx/certs (أو استعمل CA خاص بالمعمل).

upstream newport_api {
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name ops.newport.local _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ops.newport.local;

    ssl_certificate     /etc/nginx/certs/newport.local.crt;
    ssl_certificate_key /etc/nginx/certs/newport.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    client_max_body_size 40m;          # مرفقات الصور/تقارير المختبر
    charset utf-8;

    # واجهة سطح المكتب (اختياري: تُستخدم أيضًا لمراجعة الـ UI على المتصفح)
    location / {
        root /usr/share/nginx/newport/desktop;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # المزامنة: حِمل قصير ومتكرر — لا نريد تخزينًا وسيطًا ولا ضغطًا يُعطّل jsonb الصغير
    location /api/v1/sync/ {
        proxy_pass http://newport_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Device-Id $http_x_device_id;
        proxy_read_timeout 120s;
        proxy_buffering off;
        gzip off;
    }

    location /api/ {
        proxy_pass http://newport_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        limit_req zone=api_burst burst=40 nodelay;   # حماية من حلقات إعادة المحاولة في الهواتف
    }

    location /api/health {
        proxy_pass http://newport_api;
        access_log off;
    }
}

# حدود لكل IP (تطبيقًا لسياسة تسجيل الدخول): تُطبَّق قبل location /api/
